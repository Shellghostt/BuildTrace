name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container:
    name: Container image integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Build image
        run: docker build --build-arg VERSION=ci-${{ github.sha }} -t buildtrace:ci .
      - name: Exercise packaged CLI offline
        run: bash tests/container/smoke.sh buildtrace:ci

  test:
    name: Build and test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 -timeout=120s ./...

      - name: Build
        run: go build ./...

      - name: Large artifact memory and tamper gate
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/bench/large-artifact.ps1

      - name: Manifest parser fuzz smoke
        if: runner.os == 'Linux'
        run: go test ./internal/manifest -run '^$' -fuzz FuzzRead -fuzztime=10s

      - name: Unsigned statement parser fuzz smoke
        if: runner.os == 'Linux'
        run: go test ./internal/attestation -run '^$' -fuzz FuzzRead -fuzztime=10s

      - name: DSSE envelope parser fuzz smoke
        if: runner.os == 'Linux'
        run: go test ./internal/signing -run '^$' -fuzz '^FuzzDecodeEnvelope$' -fuzztime=10s

      - name: Keyless bundle parser fuzz smoke
        if: runner.os == 'Linux'
        run: go test ./internal/signing -run '^$' -fuzz '^FuzzDecodeKeylessBundle$' -fuzztime=10s

  schemas:
    name: Offline provenance schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: tests/schemas/go.sum
      - name: Set up pinned reference validator
        run: make schema-setup
      - name: Validate fixtures and schema pins offline
        env:
          GOTOOLCHAIN: 'local'
          GOPROXY: 'off'
          GOSUMDB: 'off'
        run: make schemas

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --timeout=10m

  security:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck -test ./...
      - name: Audit isolated reference validator
        working-directory: tests/schemas
        run: govulncheck -test ./...

  keyless:
    name: Keyless signing and offline verification
    # Fork PRs cannot obtain this repository's OIDC signing authority. A
    # same-repository authorized branch/PR runs the complete live evidence.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      EXPECTED_IDENTITY: https://github.com/${{ github.workflow_ref }}
      EXPECTED_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the pinned CLI
        run: make VERSION=m4-ci build
      - name: Sign synthetic artifact and verify in a network-disabled container
        run: bash tests/keyless/live.sh bin/buildtrace buildtrace:m4-keyless
      - name: Preserve public keyless verification evidence
        if: success()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: m4-keyless-evidence-${{ github.run_id }}
          retention-days: 7
          include-hidden-files: true
          path: |
            bin/m4-live.sigstore.json
            bin/m4-live/artifact.txt
            .tmp/m4-live-trusted-root.json
            .tmp/m4-live-verified.json
            .tmp/m4-live-identity-negative.json
            .tmp/m4-live-tamper-negative.json
